name: UI tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Download ApiDemos app
        run: curl -sSL -o apps/ApiDemos-debug.apk https://github.com/appium/appium/raw/master/packages/appium/sample-code/apps/ApiDemos-debug.apk

      # The emulator needs KVM, which is not enabled for the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            appium --log-no-colors > appium.log 2>&1 &
            sleep 5
            pytest -v --alluredir=allure-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            allure-results
            logs
            appium.log
